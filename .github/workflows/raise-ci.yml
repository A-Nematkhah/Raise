# Fast unit tests for raise_env (raise_core + CrowdNav domain; no GPU, no Groq network).
name: raise-env-ci

on:
  push:
    paths:
      - "raise_env/**"
      - ".github/workflows/raise-ci.yml"
  pull_request:
    paths:
      - "raise_env/**"
      - ".github/workflows/raise-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raise_env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Same torch release as requirements.txt, CPU build (the pinned
      # +cu128 wheel is GPU-only and several GB).
      - name: Install deps (CPU torch + pinned)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch==|--extra-index-url)' requirements.txt > "$RUNNER_TEMP/requirements_ci.txt"
          pip install -r "$RUNNER_TEMP/requirements_ci.txt"

      # Upstream CrowdNav's ORCA humans need Python-RVO2 (C++ library, built from source).
      - name: Build Python-RVO2
        run: |
          pip install Cython==0.29.36 cmake
          pip install --no-build-isolation "pyrvo2 @ git+https://github.com/sybrenstuvel/Python-RVO2.git@c2c46ba8d59556aa10faf03479293236efea154d"

      - name: Fast tests (exclude slow end-to-end run)
        run: |
          python -m pytest -m "not slow" -q
