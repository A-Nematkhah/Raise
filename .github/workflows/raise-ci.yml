# Fast unit tests for raise_env (raise_core + domains; no GPU, no Groq network).
name: raise-env-ci

on:
  push:
    paths:
      - "raise_env/**"
      - ".github/workflows/raise-ci.yml"
  pull_request:
    paths:
      - "raise_env/**"
      - ".github/workflows/raise-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raise_env

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Same torch release as requirements_pinned.txt, CPU build (the pinned
      # +cu128 wheel is GPU-only and several GB).
      - name: Install deps (CPU torch + pinned + highway extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch==|--extra-index-url)' requirements_pinned.txt > "$RUNNER_TEMP/requirements_ci.txt"
          pip install -r "$RUNNER_TEMP/requirements_ci.txt"
          pip install -r requirements_highway.txt

      - name: Fast tests (exclude slow simulator collect)
        run: |
          python -m pytest -m "not slow" -q
