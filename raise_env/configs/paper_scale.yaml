# RAISE paper-scale hyper-parameters (Tables 3–6).
#
# Loaded only by ``scripts/run_raise_paper_scale.py`` (or an explicit
# ``--scale paper`` request). Never selected by pytest / ``--fast``.
#
# Notation (paper Tables 3–6):
#   N, G1          Stage I population / generations
#   K2, G2, E2     Stage II train steps / rounds / eval episodes
#   K3, G3, E3     Stage III train steps / rounds / eval episodes
#   M, N_traj      Stage I trajectory dataset size (collect once)
#
# llm_provider defaults to seed for offline YAML parsing, but
# ``run_raise_paper_scale.py`` fail-closes unless you pass a real
# ``--llm`` or ``--allow-seed-llm``.

scale: paper

# Stage I analytical evolution (Table 5)
N: 8
G1: 10
M: 100
N_traj: 10
score1_mode: dataset
stage1_dataset_path: domains/crowdnav/data/stage1_dataset

# Stage II proxy refinement (Table 5)
# Paper §4.3.2: K2 = 8000 gradient steps. Pipeline / CLI defaults match
# (stage2_k2_unit=gradient_steps). Opt-in --k2-unit env_steps for legacy budgets.
K2: 8000
G2: 16
E2: 50
T_short: 100

# Stage III full PPO (Table 6)
K3: 10000000
G3: 3
E3: 500
human_counts: [5, 10, 15, 20]

# Multi-seed evaluation (methodology note — paper does not state Table 1 seed count)
# Default: 5 independent Algorithm-1 seeds; report mean±std across seeds
# (not across evaluation episodes within one seed).
n_seeds: 5
seeds: [425, 426, 427, 428, 429]

# AUDIT.md §8.1 — first validation pass
EVOLUTION_RANDOMIZATION_REGIME: without_random
# AUDIT.md §8.2 choice (a)
predict_method: inferred

device: cuda
# Intentionally not a real LLM — entry script requires --llm or --allow-seed-llm.
llm_provider: seed
output_dir: results/paper_scale
cost_log: results/paper_scale/cost_log.json
